name: Bun rewrite

on:
  pull_request:
    paths:
      - 'rewrite/**'
      - '.github/workflows/rewrite.yml'
  push:
    branches:
      - master
    # Explicit Bun releases do not match the legacy workflow's v*.*.* tags.
    tags:
      - 'bun-*'
    paths:
      - 'rewrite/**'
      - '.github/workflows/rewrite.yml'
  # Manual runs exercise checks and both native images, but never publish.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check rewrite
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: rewrite
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Check formatting
        run: bun run format:check
      - name: Check types
        run: bun run check
      - name: Run tests
        run: bun test

  image:
    name: Build and smoke Linux ${{ matrix.arch }}
    needs: check
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: rewrite
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Set image tag
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-bun:sha-${GITHUB_SHA}-${{ matrix.arch }}" >> "$GITHUB_ENV"
      - name: Build and load native image
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: ./rewrite
          file: ./rewrite/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          provenance: false
          tags: ${{ env.IMAGE }}
      - name: Smoke image without external services
        run: bun run smoke:image "$IMAGE"
      # Transfer exactly the smoke-tested images; PRs and manual runs upload nothing.
      - name: Save tested image
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/bun-')) && github.event.repository.fork == false
        run: docker save --output "$RUNNER_TEMP/image-${{ matrix.arch }}.tar" "$IMAGE"
      - name: Upload tested image
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/bun-')) && github.event.repository.fork == false
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rewrite-image-${{ matrix.arch }}
          path: ${{ runner.temp }}/image-${{ matrix.arch }}.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    name: Publish tested SHA images
    needs: image
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/bun-')) && github.event.repository.fork == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download both tested images
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: rewrite-image-*
          path: ${{ runner.temp }}/rewrite-images
          merge-multiple: true
      - name: Log into GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push architecture images and create SHA manifest
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}-bun"
          for arch in amd64 arm64; do
            docker load --input "$RUNNER_TEMP/rewrite-images/image-$arch.tar"
            docker push "$IMAGE:sha-$GITHUB_SHA-$arch"
          done
          docker buildx imagetools create \
            --tag "$IMAGE:sha-$GITHUB_SHA" \
            "$IMAGE:sha-$GITHUB_SHA-amd64" \
            "$IMAGE:sha-$GITHUB_SHA-arm64"
