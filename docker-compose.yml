services:
  telegram-bot:
    image: ghcr.io/ilyagulya/staring-misaka-python:master
    container_name: telegram-spam-detection-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - staring_misaka_data:/app/staring_misaka.data

volumes:
  staring_misaka_data:
    external: true
  staring_misaka_secret:
    external: true