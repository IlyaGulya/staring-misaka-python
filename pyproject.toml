[project]
authors = [{ name = "Ilya Gulya", email = "ilya@gulya.me" }]
dependencies = [
    "telethon==1.36.0",
    "instructor==1.10.0",
    "sqlalchemy>=2.0.35,<3",
    "anthropic==0.58.2",
    "pydantic-settings>=2.10.1,<3"
]
description = "Add a short description here"
name = "staring_misaka"
requires-python = ">3.9"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-aarch64", "linux-64"]

[tool.pixi.dependencies]
pixi-pycharm = "==0.0.9"
pytest = ">=7.0.0"
pytest-asyncio = ">=0.21.0"
pytest-mock = ">=3.10.0"
freezegun = "*"
alembic = "*"
python-dotenv = ">=1.1.1,<2"

[tool.pixi.tasks]
test = "pytest tests/ -v"
test-unit = "pytest tests/test_message_queue_model.py tests/test_queue_processor.py -v"
test-integration = "pytest tests/test_telegram_integration.py -v"
test-errors = "pytest tests/test_error_handling.py -v"
test-admin = "pytest tests/test_admin_commands.py -v"
test-coverage = "pytest tests/ --cov=. --cov-report=html --cov-report=term-missing --cov-fail-under=90"
test-e2e = "pytest tests/test_e2e_telegram.py -v -m e2e"
migrate = "alembic upgrade head"
migrate-auto = "alembic revision --autogenerate"
migrate-downgrade = "alembic downgrade -1"
migrate-status = "alembic current && alembic history"
migrate-setup-prod = "python scripts/production_migration_setup.py"
migrate-rollback = "python scripts/rollback_migration.py"
docker-entrypoint = "python docker-entrypoint.py"
start = "python main.py"

[tool.hatch.build.targets.wheel]
include = ["*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
    "-s",  # Never capture output
    "--capture=no",  # Disable all capturing
]
markers = [
    "asyncio: marks tests as async (deselect with '-m \"not asyncio\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "e2e: marks tests as end-to-end integration tests (deselect with '-m \"not e2e\"')",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
