[project]
authors = [{ name = "Ilya Gulya", email = "ilya@gulya.me" }]
dependencies = [
    "telethon==1.36.0",
    "instructor==1.10.0",
    "sqlalchemy>=2.0.35,<3",
    "anthropic==0.58.2",
]
description = "Add a short description here"
name = "staring_misaka"
requires-python = ">3.9"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-aarch64", "linux-64"]

[tool.pixi.dependencies]
pixi-pycharm = ">=0.0.6,<0.0.7"
pytest = ">=7.0.0"
pytest-asyncio = ">=0.21.0"
pytest-mock = ">=3.10.0"
pydantic-settings = ">=2.10.1,<3"
freezegun = "*"
alembic = "*"
python-dotenv = ">=1.1.1,<2"

[tool.pixi.tasks]
test = "pytest tests/ -v"
test-unit = "pytest tests/test_message_queue_model.py tests/test_queue_processor.py -v"
test-integration = "pytest tests/test_telegram_integration.py -v"
test-errors = "pytest tests/test_error_handling.py -v"
test-admin = "pytest tests/test_admin_commands.py -v"
test-coverage = "pytest tests/ --cov=. --cov-report=html --cov-report=term"
migrate = "alembic upgrade head"
migrate-auto = "alembic revision --autogenerate"
migrate-downgrade = "alembic downgrade -1"
migrate-status = "alembic current && alembic history"
migrate-setup-prod = "python scripts/production_migration_setup.py"
migrate-rollback = "python scripts/rollback_migration.py"
docker-entrypoint = "python docker-entrypoint.py"
start = "python main.py"

[tool.hatch.build.targets.wheel]
include = ["*.py"]
