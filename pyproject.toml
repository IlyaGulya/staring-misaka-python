[project]
name = "staring_misaka"
version = "0.2.0"
description = "Advanced Telegram spam detection bot"
authors = [{ name = "Ilya Gulya", email = "ilya@gulya.me" }]
requires-python = ">=3.10"
dependencies = [
    "telethon==1.40.0",
    "instructor==1.8.1",
    "anthropic==0.51.0",
    "sqlalchemy==2.0.40",
    "python-dotenv==1.1.0",
    "prometheus-client==0.21.1",
    "pydantic==2.11.4",
    "typing-inspect==0.9.0",
    "typing_extensions==4.13.2",
    "pandas==2.2.3",
    "gradio==5.29.0",
    "aiosqlite==0.21.0",
    "greenlet==3.2.1" # Added for SQLAlchemy async + aiosqlite
]

[project.scripts]
staring-misaka = "staring_misaka.__main__:run" # This might need to be src.staring_misaka.__main__:run if hatch doesn't handle it

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/staring_misaka"] # MODIFIED for src layout

# --- Pixi Specific Configuration ---
[tool.pixi.project]
channels = ["conda-forge", "nodefaults"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]

[tool.pixi.dependencies]
python = ">=3.12.0,<3.13"
pytest = "==8.3.5"
pytest-asyncio = "==0.26.0"
pytest-cov = "==6.1.1"
pytest-mock = "==3.14.0"
pytest-xdist = "==3.6.1"
ruff = "==0.11.0"
greenlet = "==3.2.1"
pixi-pycharm = ">=0.0.8,<0.0.9"
pydantic-settings = ">=2.9.1,<3"

[tool.pixi.tasks]
start = { cmd = "staring-misaka", depends-on = [] }
test = { cmd = "pytest tests", depends-on = [] }
test-unit = { cmd = "pytest tests/unit", depends-on = [] }
test-integration = { cmd = "pytest tests/integration", depends-on = [] }
test-cov = { cmd = "pytest --cov=src.staring_misaka --cov-report=term-missing --cov-report=html tests", depends-on = [] } # MODIFIED for src layout

# Ruff tasks
lint = { cmd = "ruff check ./src/staring_misaka ./tests", depends-on = [] } # MODIFIED for src layout
lint-fix = { cmd = "ruff check --fix ./src/staring_misaka ./tests", depends-on = [] } # MODIFIED for src layout
format = { cmd = "ruff format ./src/staring_misaka ./tests", depends-on = [] } # MODIFIED for src layout

[tool.pixi.pypi-dependencies]
staring_misaka = { path = ".", editable = true }

# --- Pytest Configuration ---
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src", "."] # MODIFIED to include project root for tests imports
testpaths = ["tests"]

# --- Ruff Configuration ---
[tool.ruff]
# Same as Black.
line-length = 120 # Or 88, or your preferred length
indent-width = 4

# Assume Python 3.10+ features are available.
target-version = "py310"

[tool.ruff.lint]
# Enable Pyflakes and Pycodestyle, then add more specific rule sets.
# See https://docs.astral.sh/ruff/rules/ for all rules.
select = [
    "E", # Pycodestyle errors
    "W", # Pycodestyle warnings
    "F", # Pyflakes
    "I", # isort (import sorting)
    "UP", # pyupgrade (modernize Python code)
    "B", # flake8-bugbear (potential bugs and design problems)
    "C4", # flake8-comprehensions (unnecessary comprehensions)
    "SIM", # flake8-simplify (simplify code)
    "PT", # flake8-pytest-style
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501", # Line too long (handled by ruff format or manually if preferred)
    "E701", # Multiple statements on one line
]

fixable = ["ALL"]
unfixable = []

exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pixi",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "htmlcov",
]

[tool.ruff.lint.isort]
# known-first-party = ["staring_misaka"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
